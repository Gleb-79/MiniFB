name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git ffmpeg libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev libportmidi-dev libswscale-dev libavformat-dev libavcodec-dev zlib1g-dev autoconf automake libtool libltdl-dev pkg-config cmake libffi-dev libssl-dev unzip zip openjdk-17-jdk

      - name: Install Buildozer and Cython
        run: |
          pip install --upgrade pip
          pip install buildozer==1.5.0 cython==0.29.36

      - name: Configure NDK, p4a, requirements and extensions
        run: |
          sed -i 's/^#\?android.ndk *=.*/android.ndk = 25b/' buildozer.spec
          sed -i 's/^#\?p4a.branch *=.*/p4a.branch = v2024.01.21/' buildozer.spec
          sed -i 's/^requirements *=.*/requirements = python3==3.11.5,hostpython3==3.11.5,kivy==2.3.0/' buildozer.spec
          sed -i 's/^source.include_exts *=.*/source.include_exts = py,png,jpg,kv,atlas,mp3,wav,ogg,ttf,json/' buildozer.spec
          echo "---- spec check ----"
          grep -E "^(requirements|p4a|android.ndk|source.include_exts)" buildozer.spec

      - name: Cache Buildozer global directory
        uses: actions/cache@v4
        with:
          path: .buildozer
          key: ${{ runner.os }}-2204-v5-buildozer-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            ${{ runner.os }}-2204-v5-buildozer-

      - name: Remove stale python-for-android checkout
        run: rm -rf .buildozer/android/platform/python-for-android

      - name: Build with Buildozer
        run: yes | buildozer android debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: package
          path: bin/*.apk
