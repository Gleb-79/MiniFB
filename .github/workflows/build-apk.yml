name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git ffmpeg libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev libportmidi-dev libswscale-dev libavformat-dev libavcodec-dev zlib1g-dev autoconf automake libtool libltdl-dev pkg-config cmake libffi-dev libssl-dev unzip zip

      - name: Install Buildozer and Cython
        run: |
          pip install --upgrade pip
          pip install buildozer==1.5.0 cython==0.29.36

      - name: Configure NDK, p4a, requirements and extensions
        run: |
          sed -i '/^#\?\s*p4a\.branch\s*=/d' buildozer.spec
          sed -i '/^#\?\s*android\.ndk\s*=/d' buildozer.spec
          sed -i '/^#\?\s*android\.api\s*=/d' buildozer.spec
          sed -i '/^#\?\s*android\.archs\s*=/d' buildozer.spec
          sed -i '/^#\?\s*android\.release_artifact\s*=/d' buildozer.spec
          sed -i '/^#\?\s*icon\.filename\s*=/d' buildozer.spec
          sed -i '/^\[app\]/a p4a.branch = develop\nandroid.ndk = 28c\nandroid.api = 36\nandroid.archs = arm64-v8a\nandroid.release_artifact = apk\nicon.filename = %(source.dir)s/icon.png' buildozer.spec
          sed -i
